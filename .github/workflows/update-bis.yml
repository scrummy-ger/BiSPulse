name: Update Wowhead BiS

on:
  schedule:
    # Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        working-directory: tools
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape Wowhead guides
        working-directory: tools
        run: node scrape_wowhead.mjs

      - name: Generate Data/*.lua
        run: python tools/scrape_method_bis.py --wowhead-json tools/wowhead_browser_data.json

      - name: Open PR if lists changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh Wowhead BiS lists"
          title: "Weekly Wowhead BiS refresh"
          body: |
            Automated scrape of Wowhead Overall BiS guides.

            After merge:
            1. Bump `## Version` in `BiSPulse.toc` if needed
            2. Upload a new CurseForge/Wago release so players get the lists via auto-update
          branch: chore/wowhead-bis-refresh
          delete-branch: true
          labels: data, automated
